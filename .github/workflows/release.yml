name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: "v1.2.1"

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          bash scripts/build-release.sh --version "$VERSION" --tag "$TAG" --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/release/v${{ github.event.inputs.version }}/my-proxy-*.zip
          retention-days: 30
